name: Scrape ARC News

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scrape_arc.py

      - name: Commit RSS file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arc-ai.xml
          git diff --cached --quiet || git commit -m "chore: update ARC news RSS feed"
          git push
